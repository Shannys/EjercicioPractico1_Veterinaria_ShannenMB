<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultas | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<h2>Envíanos una consulta</h2><p>Escríbenos para conocer más sobre nuestros servicios.</p><div class="card p-4"><form th:action="@{/consultas}" method="post"><div class="mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" name="nombre" required maxlength="100"></div><div class="mb-3"><label class="form-label">Correo electrónico</label><input type="email" class="form-control" name="correo" required maxlength="150"></div><div class="mb-3"><label class="form-label">Nombre de la mascota</label><input type="text" class="form-control" name="mascota" required maxlength="100"></div><div class="mb-3"><label class="form-label">Mensaje</label><textarea class="form-control" name="mensaje" rows="5" required></textarea></div><button class="btn btn-primary" type="submit">Enviar consulta</button></form></div><p class="text-muted small mt-3">Este formulario es demostrativo y no almacena mensajes en la base de datos.</p>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
