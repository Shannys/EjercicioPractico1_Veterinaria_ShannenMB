<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tipos de servicio | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<div class="d-flex justify-content-between align-items-center mb-4"><h2>Tipos de servicio</h2><a class="btn btn-primary" th:href="@{/tipos/nuevo}">Agregar tipo</a></div>
<div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nombre</th><th>Descripción</th><th>Servicios asociados</th><th>Acciones</th></tr></thead><tbody><tr th:each="tipo : ${tipos}"><td th:text="${tipo.nombre}"></td><td th:text="${tipo.descripcion}"></td><td th:text="${conteos.getOrDefault(tipo.id, 0L)}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/tipos/{id}/editar(id=${tipo.id})}">Editar</a> <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:attr="data-bs-target='#borrarTipo'+${tipo.id}">Eliminar</button>
<div class="modal fade" th:id="'borrarTipo'+${tipo.id}" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">¿Eliminar el tipo <strong th:text="${tipo.nombre}"></strong>?</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form method="post" th:action="@{/tipos/{id}/eliminar(id=${tipo.id})}"><button class="btn btn-danger" type="submit">Eliminar</button></form></div></div></div></div>
</td></tr><tr th:if="${#lists.isEmpty(tipos)}"><td colspan="4">No hay tipos registrados.</td></tr></tbody></table></div></div>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
