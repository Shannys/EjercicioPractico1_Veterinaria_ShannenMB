<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario tipo | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<h2 th:text="${tipo.id == null ? 'Nuevo tipo de servicio' : 'Editar tipo de servicio'}"></h2><div class="card p-4 mt-4"><form th:action="@{/tipos/guardar}" th:object="${tipo}" method="post"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" maxlength="100" required></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" maxlength="255" rows="3"></textarea></div><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/tipos}">Cancelar</a></form></div>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
