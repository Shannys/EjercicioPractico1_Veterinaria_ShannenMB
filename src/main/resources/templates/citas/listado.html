<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Citas | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<h2 class="mb-4">Citas programadas</h2><p>Consulta de citas en modo de solo lectura.</p><div class="card p-3"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mascota</th><th>Propietario</th><th>Fecha</th><th>Servicio</th></tr></thead><tbody><tr th:each="cita : ${citas}"><td th:text="${cita.nombreMascota}"></td><td th:text="${cita.nombrePropietario}"></td><td th:text="${#temporals.format(cita.fecha,'dd/MM/yyyy')}"></td><td th:text="${cita.servicio.nombre}"></td></tr><tr th:if="${#lists.isEmpty(citas)}"><td colspan="4">No hay citas registradas.</td></tr></tbody></table></div></div>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
