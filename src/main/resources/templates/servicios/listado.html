<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Servicios veterinarios | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<div class="d-flex justify-content-between align-items-center mb-4"><h2>Servicios veterinarios</h2><a class="btn btn-primary" th:href="@{/servicios/nuevo}">Agregar servicio</a></div><div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nombre</th><th>Tipo</th><th>Precio (₡)</th><th>Duración</th><th>Acciones</th></tr></thead><tbody><tr th:each="servicio : ${servicios}"><td th:text="${servicio.nombre}"></td><td th:text="${servicio.tipoServicio.nombre}"></td><td th:text="${#numbers.formatDecimal(servicio.precio,1,'COMMA',2,'POINT')}"></td><td th:text="|${servicio.duracionMinutos} min|"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/servicios/{id}/editar(id=${servicio.id})}">Editar</a> <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal" th:attr="data-bs-target='#borrarServicio'+${servicio.id}">Eliminar</button>
<div class="modal fade" tabindex="-1" th:id="'borrarServicio'+${servicio.id}"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">¿Eliminar el servicio <strong th:text="${servicio.nombre}"></strong>?</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form method="post" th:action="@{/servicios/{id}/eliminar(id=${servicio.id})}"><button class="btn btn-danger" type="submit">Eliminar</button></form></div></div></div></div>
</td></tr><tr th:if="${#lists.isEmpty(servicios)}"><td colspan="5">No hay servicios registrados.</td></tr></tbody></table></div></div>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
