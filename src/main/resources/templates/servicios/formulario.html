<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario servicio | Huellitas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: cabecera}"></div><div th:replace="~{fragments/layout :: navegacion}"></div><main class="container py-5"><div th:replace="~{fragments/layout :: avisos}"></div>
<h2 th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}"></h2><div class="card p-4 mt-4"><form th:object="${servicio}" th:action="@{/servicios/guardar}" method="post"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Nombre del servicio</label><input class="form-control" th:field="*{nombre}" maxlength="100" required></div><div class="mb-3"><label class="form-label">Tipo de servicio</label><select class="form-select" th:field="*{tipoServicio.id}" required><option value="">Seleccione un tipo</option><option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option></select></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Precio (₡)</label><input class="form-control" type="number" min="0" max="999999.99" step="0.01" th:field="*{precio}" required></div><div class="col-md-6 mb-3"><label class="form-label">Duración (minutos)</label><input class="form-control" type="number" min="1" th:field="*{duracionMinutos}" required></div></div><button type="submit" class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/servicios}">Cancelar</a></form></div>
</main><div th:replace="~{fragments/layout :: pie}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
